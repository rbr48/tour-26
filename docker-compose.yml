services:
  tour-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tour2026-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8190:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FIREBASE_PROJECT_ID=tour-26
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-*}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
