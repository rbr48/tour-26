name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test, Rules & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Unit & Server Tests
        run: npm test

      - name: Run Firestore Rules Tests (Emulator)
        run: npm run test:rules

      - name: Build Web Production Bundle
        run: npm run build

      - name: Security Audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high
