version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      capacitor:
        patterns:
          - "@capacitor*"
      firebase:
        patterns:
          - "firebase*"
          - "@firebase*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
